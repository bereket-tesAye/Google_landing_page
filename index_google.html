<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_google.css">
    <title>Document</title>
</head>

<body>
    <nav class="navbar">
        <a class="linka" href="#">Gmail</a>
        <a class="linkb" href="#">Images</a>
        <button class="signin-button">
            Sign In
        </button>

    </nav>
    <main>
        <div class="logo">
            <img src="assets\google_logo.png" alt="Google Logo">
        </div>
        <div class="search-wrapper">
            <div class="search-bar-container">
                <span class="search-icon">
                    <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path
                            d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z">
                        </path>
                    </svg>
                </span>
                <input type="text" class="search-input" autofocus>
                <div class="search-tools">
                    <img src="assets/Google_mic.svg.png" alt="Mic" class="tool-icon">
                </div>
            </div>
        </div>
        <div>
            <button class="search-button">Google Search</button>
            <button class="lucky-button">I'm Feeling Lucky</button>
        </div>
    </main>
    <footer class="footer">
        <div class="country">
            <a href="#">Ethiopia</a>
        </div>

        <div class="links-container">
            <div class="links-left">
                <a href="#">About</a>
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search works</a>
            </div>
            <div class="links-right">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>
        </div>
    </footer>

</body>

</html>
